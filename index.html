  <style>

    .cell {

      height: 40px;*/

    }
    .cell.selected {

    }

    .black { 
    color: black;

    color: white;
    }

    }

    .cell.clue {

      background-color: black;
      /*width: 42px;
      height: 42px;*/

      height: 46px;
      box-sizing: border-box;
    }

    .cell .slash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent 49%, white 50%, transparent 51%);
    }

    .cell .clue-right {
      position: absolute;

      right: 4px;
      color: white;
      font-size: 14px;
    }

    .cell .clue-down {
      position: absolute;
      bottom: 2px;
      left: 4px;
      color: white;
      font-size: 14px;
    }

    .popup {
      position: fixed;
      /* position: absolute; */
      background: white;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      z-index: 20;   /* ← これを上にする */

/*  */

    }

    }

    }

    }

    }

    }

    }  

    
    .hidden {

    }

      touch-action: manipulation;
    }

    let selectedAssume = null;

    let isCopyMode = false;
    let beforeMode = "input";
    let allpuzzle = {};

    let puzzle;
    let puzzleData = null;
    // 生テキストの代わりに、問題ごとの「文字列」を格納する配列（またはオブジェクト）を用意
    let puzzleTextMap = {};

    let isExistNumber = false;

    let fixNumbers = [];

    // 配列に設定する色とID変換テーブル

    const actiontypeTable = [

    // 150問 × 81個の特殊マス ＝ 約12,150要素。余裕を持って20,000要素確保（わずか80KB）
    const allStagesData = new Int32Array(20000);

    const stageMetadata = {};

    let stageIdList = [];

    // ビットシフトの設定
    const SHIFT_X      = 0;

    // =====================================================================
    // ** PCとスマホ共通 **                             
    // =====================================================================

    //------------------------------------------------
    // 数値をマス上に表示   
    // 数値が入力された場合に呼ばれるが、PCの場合は既存のspanに同じ数値がある場合もある。
    // スマホの場合、ポップアップの数値をクリックした場合で、かつ、マスにその数値が未登録の場合にのみ呼ばれる。
    // ここでは、spanを設定する前のマスに数値が存在しているか否かはわからない。
    // function handleNumber(num) {
    function handleNumber(num, isExistNum) {

      // spanを作成し、子として登録
      // 例、<span class="black">1</span>
      const span = document.createElement("span");
      //span.textContent = e.key;

      // 変更前の状態登録
      saveUndo("toggle", span, isExistNum, num);



      span.textContent = String(num);
      span.classList.add("black");
      // <div class="cell selected" data-x="1" data-y="1"></div>
      selectedCell.appendChild(span);
      //<div class="cell selected" data-x="1" data-y="1">
      // <span class="black">1</span>
      //</div>
    }


    //------------------------------------------------
    // DELETまたはBackspaceによる削除処理 
    function handleDelete() {

        const spans = selectedCell.querySelectorAll("span");
        if (spans.length > 0) spans[spans.length - 1].remove();
    
    }


    //------------------------------------------------
    // CTRL＋Cによるコピー処理 
    function handleCopy() {

      const selected = document.querySelector('.cell.selected');

      if (selected) {
        // マス内の候補<span>をすべてコピー
        copiedCandidates = Array.from(selected.querySelectorAll('span')).map(span => ({
          value: span.textContent,
          className: span.className
        }));
      }

    }   
    

    //------------------------------------------------
    // CTRL＋Vによるペースト処理 
    function handlePaste() {

      const selected = document.querySelector('.cell.selected');
      if (selected && copiedCandidates) {
        selected.innerHTML = ''; // 現在の候補を削除
        for (let data of copiedCandidates) {
          const span = document.createElement('span');
          span.textContent = data.value;
          span.className = data.className;
          selected.appendChild(span);
        }
      }
    }



    //------------------------------------------------
    // 仮定モード中の数字クリック処理（黒⇔水色）
    function numberAssumeMode(span) {


      // 仮定モード中の処理
      if (span.classList.contains("red") || span.classList.contains("gray") ) {
        ;
      } else if (span.classList.contains("cyan")) {

        toggleGrayAssumeMode(span);
        saveUndo("toggle", span);
        span.classList.replace("cyan","black");
      } else {
        
        toggleGrayAssumeMode(span);
        saveUndo("toggle", span);
        span.classList.replace("black","cyan");         
      }
    }


    //------------------------------------------------
    // 仮定モードONとなる数字クリック処理（黒⇔赤）
    function numberAssumeModeON(span) {

      //  仮定モードON
      // 以下2つの関数（①toggleGrayAssumeMode、②saveUndo）で、両方の配列（assumedChangesとundoStack）にpushしている。
      // Q.両方の配列を持つ必要があるのか？
      // Q. 仮定モードONにしたとき（黒→赤）の時にも①の関数が呼ばれる。①は水色になる前だけ呼ばれるのでは？
      toggleGrayAssumeMode(span);   // assumedChangesに追加　（仮定モード中の全処理を追加）
      saveUndo("toggle", span);     // undoStackに追加　（変更前のこの値だけ１個の状態を保持）

      // e.target.classList.replace("black","red");
      span.classList.replace("black","red");
      isAssumeMode = true;
      isInputMode = false;

    }

    //------------------------------------------------
    // 仮定モードOFFとなる数字クリック処理（赤⇔黒）
    function numberAssumeModeOFF(span) {
      
      // saveUndo("toggle", e);
      saveUndo("toggle", span);
      span.classList.replace("red","black");
      // 仮定モードONにする前の状態に戻す。
      revertAssumeChanges();
      // inAssumeMode = false;
      // clearHypothetical();
      //読み込んだ時に仮定モードになっていた場合、水色の所を黒に戻す。
      if (isAssumeCyan) {
        revertLoadCyanChange();
        // isAssumeCyan = false;
      }

    }    


    //------------------------------------------------
    // 候補モード(通常モード)中の数字クリック処理（黒⇔灰色）
    function numberCandidateMode(span) {

      isInputMode = true;
      saveUndo("toggle", span);
      if (span.classList.contains("black")) {
        span.classList.replace("black","gray"); 
      } else if (span.classList.contains("gray")) {
        span.classList.replace("gray","black");           
      }
            
    }



    // =====================================================================
    // ** スマホ版関連（ポップアップ） **                             
    // =====================================================================

    //------------------------------------------------
    // ポップアップクローズ
    function closePopup() {
      document.getElementById("cellPopup")
              .classList.add("hidden");
      if (selectedCell) selectedCell.classList.remove("selected");

    }


    //------------------------------------------------
    // ポップアップ表示
    function openPopup(div, event) {
      const popup = document.getElementById("cellPopup");
      const spans = div.querySelectorAll("span");
      const popupWidth = 200;
      const popupHeight = 250;

      let html = "";
      let displayValue = "";

      if (!usePopup) return;

      spans.forEach(span => {
        const value = span.textContent;

        displayValue += span.textContent;  
        
      });
    
      popup.classList.remove("hidden");
      updatePopupNumbers(div);

      
      // 位置は更新するが消さない
      let left = event.clientX;
      let top = event.clientY - popupHeight;

      if (left + popupWidth > window.innerWidth) {
        left = window.innerWidth - popupWidth - 10;
      }
    

      if (top < 0) {
        top = 10;
      }
      popup.style.transform = ""; 
      popup.style.left = left + "px";
      popup.style.top = top + "px";

    }

    
    //------------------------------------------------
    // ポップアップモード見た目反映
    function updateModeButtons() {

      const buttons = document.querySelectorAll(".popup-modes button");

      buttons.forEach(btn => {
        btn.classList.remove("active-mode");

        if (btn.dataset.mode === currentMode) {
          btn.classList.add("active-mode");
        } else {
          btn.classList.remove("active-mode");
          btn.classList.remove("active-mode-sub");
        }

        if ((btn.dataset.mode == "confirm") &&
            ((currentMode == "input") || (currentMode == "candidate"))) {
          btn.classList.remove("active-mode");
          btn.classList.add("active-mode-sub");
        }

      });      
      
    }
    

    //------------------------------------------------
    // ポップアップ選択によるモード状態true/false
    function setIsMode(isin, iscan, isassu, iscop) {
      
      isInputMode = isin;
      isCandidateMode = iscan;
      isAssumeMode = isassu;
      isCopyMode = iscop; 

    }

    //------------------------------------------------
    // ポップアップ選択によるモード切替
    function setMode(mode) {
      // window.inputMode = mode;
      let subMode = null;

      if (selectedAssume) {
        if ((mode == "candidate") || (mode == "input") || (mode == "copy") || (mode == "paste")) {
          return;
        }
      }

      if (mode == "confirm") {
        subMode = "confirm";
      } else {
        currentMode = mode;
      }
      
      if (currentMode == "input") {
        // if (!isAssumeMode) {
        if (!selectedAssume) {
          setIsMode(true, false, false, false);
        }       
      }
      if (currentMode == "candidate"){
        // if (!isAssumeMode) {
        if (!selectedAssume) {
          setIsMode(false, true, false, false);
        }
      }
      if (currentMode == "assume") {
        if (!isAssumeMode) {
          selectedAssume = null;
        }
        setIsMode(false, false, true, false);
      } 
      if ((subMode == "confirm") && (currentMode != "assume")) {
        const span = selectedCell;
        saveUndo("confirm", span);
        confirmCell(selectedCell);
        updatePopupNumbers(selectedCell);
      }
      if (currentMode == "copy") {
        if (!isAssumeMode){  
          setIsMode(false, false, false, true);
          handleCopy();
        }  
      }
      if (currentMode == "paste") {
        if (isCopyMode) {
          handlePaste();
          updatePopupNumbers(selectedCell);
        }
      }
      if (currentMode == "undo") {
        undo(); 
        updatePopupNumbers(selectedCell);    
      }
      
      updateModeButtons();
    }


    //------------------------------------------------
    // ポップアップモードエリア
    function initPopupModes() {
      const modeArea = document.querySelector(".popup-modes");

      modeArea.innerHTML = `
        <button data-mode="input">入</button>
        <button data-mode="candidate" >候</button>
        <button data-mode="assume">仮</button>
        <button data-mode="confirm">確</button>
        <button data-mode="copy">コ</button>
        <button data-mode="paste">ペ</button>
        <button data-mode="undo">戻</button>
      `;
      
      // ポップアップモードボタンクリック時の処理
      initModeButtons();
 
    }
    
    
    //------------------------------------------------
    // ポップアップモードボタンクリック時の処理    
    function initModeButtons(){

      document.querySelectorAll(".popup-modes button").forEach(btn => {
      
        // ポップアップモードボタンがクリックされたら、下記①②の処理を行うよう登録しておく。
        btn.addEventListener("click", function(e){
          // ①親側への伝搬を停止
          e.stopPropagation();
          // ②モードの設定
          setMode(this.dataset.mode);

        });

      });
    }

    //------------------------------------------------
    //　ポップアップ数値部ボタンの初期化    
    // アプリ起動時に「1回だけ」呼び出して、1〜9のボタンを固定で生成しておく関数
    function initPopupNumbers() {
      const numberArea = document.querySelector(".popup-numbers");
      
      // 念のため中身を一度空にする
      numberArea.innerHTML = "";

      // 1〜9のボタンを「1度だけ」生成して配置
      for (let i = 1; i <= 9; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        // ボタンの識別用に data 属性を付与しておく
        btn.dataset.num = i;

        // イベント関数もここに1回だけ登録（使い回されるためゴミにならない！）
        btn.onclick = function(event) {
          selectNumber(i);
          event.stopPropagation();
        };

        numberArea.appendChild(btn);
      }
    }

    //------------------------------------------------
    //　ポップアップ数値更新
    function updatePopupNumbers(div) {
      
      const numberArea = document.querySelector(".popup-numbers");
      const spans = div.querySelectorAll("span");


      fixNumbers.length = 0;
      blackNumbers.length = 0;
      grayNumbers.length = 0;
      cyanNumbers.length = 0;
      redNumbers.length = 0;
      whiteNumbers.length = 0;

      // spanを見て、マスに設定されている数値を取得し、candidateNumbersに設定①
      //　【修正後】 
      spans.forEach(span => {
        const value = span.textContent;
        if (span.classList.contains("fixed"))      fixNumbers.push(value);
        else if (span.classList.contains("black")) blackNumbers.push(value);     
        else if (span.classList.contains("gray"))  grayNumbers.push(value);       
        else if (span.classList.contains("cyan"))  cyanNumbers.push(value);
        else if (span.classList.contains("red"))   redNumbers.push(value);
        else if (span.classList.contains("white")) whiteNumbers.push(value);
      });      


      // 【劇的改善】innerHTML = "" や createElement を全削除！
      // すでに画面にある9個のボタンをループで取得してクラス名（色）だけを更新する
      for (let i = 1; i <= 9; i++) {
        // 既存のボタンを data 属性からピンポイントで取得
        const btn = numberArea.querySelector(`button[data-num="${i}"]`);
        if (!btn) continue;

        let className = "";
        if      (fixNumbers.includes(String(i)))   className = "fix";  //　ボタンの場合はclasName="fix"。"fixed"はspanで使う時のみ
        else if (blackNumbers.includes(String(i))) className = "black";
        else if (grayNumbers.includes(String(i)))  className = "gray";
        else if (cyanNumbers.includes(String(i)))  className = "cyan";
        else if (redNumbers.includes(String(i)))   className = "red";
        else if (whiteNumbers.includes(String(i))) className = "white";

        // クラス名（色）だけを上書き（メモリのゴミは1バイトも出ません）
        btn.className = className;      

      }
    }    


    //------------------------------------------------
    // ポップアップのUPDATE（数値の更新）   
    function updatePopup(div) {
      const popup = document.getElementById("cellPopup");

    //------------------------------------------------
    //  hintの数列算出  
    function getCombinations(targetSum, length) {
      const results = [];

      function dfs(start, path, sum) {
        if (path.length === length) {
          if (sum === targetSum) {
            results.push([...path]);
          }
          return;
        }

        for (let i = start; i <= 9; i++) {
          if (sum + i > targetSum) break;

          path.push(i);
          dfs(i + 1, path, sum + i);
          path.pop();
        }
      }
      dfs(1, [], 0);
      return results;
    }
    
    //------------------------------------------------
    //  hintの数列表示処理  
    function showHintResult() {
        const length = parseInt(document.getElementById("hintLength").value);
        const sum = parseInt(document.getElementById("hintSum").value);

        const results = getCombinations(sum, length);
        const container = document.getElementById("hintResult");

        container.innerHTML = "";

        const header = document.createElement("div");
        header.textContent = `Sum=${sum},  Len=${length}`;
        header.style.marginBottom = "5px";
        container.appendChild(header);

        const hr = document.createElement("hr");
        container.appendChild(hr);

        if (results.length === 0) {
          const noData = document.createElement("div");
          noData.textContent = "None"; // または "None"
          container.appendChild(noData);
          return;
        }

        results.sort((a, b) => {
          for (let i = a.length - 1; i >= 0; i--) {
            if (a[i] !== b[i]) {
              return b[i] - a[i]; // 降順
            }
          }
          return 0;
        });

        results.forEach(r => {
          const div = document.createElement("div");
          div.textContent = r.slice().reverse().join(" ");
          container.appendChild(div);
        });
    }

    //------------------------------------------------
    //  確定処理
    function confirmCell(cell) {

      const spans = cell.querySelectorAll("span");
      let validCandidates = 0;
      let candidatesPosi = 0;
      let i = 0;
      
      // 黒数字をカウント
      const blackCount = countCell(cell);

      if (blackCount == 0) return;

      spans.forEach(span => {
        if (span.classList.contains("gray")) {
          // 灰色⇒白
          span.classList.replace("gray","white"); 
        }
        if (span.classList.contains("black")) {
          // 候補数をカウント
          validCandidates ++;
          candidatesPosi = i;    
        }
        i ++;
      });

      //  候補が残り1つの場合、
      // <span class="black">7</span>を
      // <span class="fixed">7</span>にする
      // fixedにしたことで、文字サイズが大きくなる。
      if (validCandidates == 1) {
        cell.innerHTML = `<span class="fixed">${spans[candidatesPosi].textContent}</span>`;
      }
    }
    

    //------------------------------------------------
    // 候補（黒色）数を算出 
    function countCell(cell) {

      const spans = cell.querySelectorAll("span");
      let validCandidates = 0;

      spans.forEach(span => {
        if (span.classList.contains("black")) {
          validCandidates++;
        }
      });
      return validCandidates;
    }


    //------------------------------------------------
    // 1つ前の処理保存
    // undoStackに登録。　actiontypeがconfirmの時は、マスに入っている全ての数字を登録しし、それ以外の時は、特定の数字のみ登録
    // 戻す時は、undok関数にて実施。
    // 
    // 配列への登録は、既存spanにデータの存在は関係ない。データが存在しない場合、数値は次に設定に値を、xy現在選択セルから情報を取得すればいい。
    // 多分読み出し時に影響があるのだろう。
    // function saveUndo(actiontype, e) {

    // function saveUndo(actiontype, span) {
    function saveUndo(actiontype, span, isExistNum = true, num) {

      // console.count("--- saveUndoが呼ばれた回数");
      const cell = span.closest('.cell');

      undoStack.length = 0;
      // const action = actiontypeTable[actiontype];
      const action = actiontypeTable.indexOf(actiontype);
      
      if (actiontype  === "confirm") {

      // 例：{ type: 'gray-toggle', x: 3, y: 5, number: '4', prev: 'black' }
        undoStack.push({
          type: action,
          x: Number(cell.dataset.x),
          y: Number(cell.dataset.y),
          before: Array.from(cell.querySelectorAll('span')).map(span => {
            const cid = classNameTable.indexOf(span.className);
            return {
              value: Number(span.textContent),
              className: cid
            };
          })
        });
      } else if (actiontype  === "toggle") {
        if (!isExistNum){

          // ====================================
          // 【追加】数値が存在しなかった場合の処理
          //  className=unused, value=存在しない数値を設定
          // ====================================
          undoStack.push({
            type: action,
            x: Number(selectedCell.dataset.x),
            y: Number(selectedCell.dataset.y),
            // value: span.textContent !=="" ? Number(span.textContent) : 0,
            value: Number(num),
            className: classNameTable.indexOf("unused")
          });
        } else {
          undoStack.push({
            type: action,
            x: Number(cell.dataset.x),
            y: Number(cell.dataset.y),
            // x: Number(selectedCell.dataset.x),
            // y: Number(selectedCell.dataset.y),
            // value: span.textContent !=="" ? Number(span.textContent) : 0,
            value: Number(span.textContent),
            className: classNameTable.indexOf(span.className)
          });
        }
      }

    }


    //------------------------------------------------ 
    // UNDO処理
    // saveUndo関数で登録した1つ前の処理に戻す。
    // 前の処理が、confirmで登録していたら、マス全体の数値を戻す。
    function undo() {
      
      // console.count("**** Undoが呼ばれた回数");
      const last = undoStack.pop();
      if (!last) return;

      const cell = document.querySelector(`.cell[data-x="${last.x}"][data-y="${last.y}"]`);
      const actiontype = actiontypeTable[last.type];
      
      if (actiontype == "confirm") {
        // マス全体を戻す
        cell.innerHTML = "";
        last.before.forEach(d => {
          const span = document.createElement("span");
          span.textContent = d.value;
          span.classList.add(classNameTable[d.className]);
          cell.appendChild(span);
        });

      } else if (actiontype == "toggle") {
        // 特定の数字の色だけ戻す
        const span = Array.from(cell.querySelectorAll('span'))
                          .find(s => Number(s.textContent) === last.value);
        if (span) {
          if (last.className === 0) {
            // console.count("<<< undoでremoveした回数");
            span.remove();
          } else {
            span.className = classNameTable[last.className];
          }
        }
      }  

    }


    //------------------------------------------------
    //  仮定モード時にクリックした数字（水色になる＝候補数字）の水色になる前の状態を保存。OFFにしたときに戻すために必要。
    //　戻すのは、revertAssumeChangesで実行。
    // function toggleGrayAssumeMode(e) {
    function toggleGrayAssumeMode(span) {
      // if (!inAssumeMode) return;
      if (!isAssumeMode) return;

      const cell = span.closest('.cell');
      const x = Number(cell.dataset.x);
      const y = Number(cell.dataset.y);

      assumedChanges.push({
        x, y,
        // value: span.textContent !=="" ? Number(span.textContent) : 0,
        value: Number(span.textContent),
        previousClass: classNameTable.indexOf(span.className)

    //　仮定モードの時に保存したのは、toggleGrayAssumeModeで実行。
    function revertAssumeChanges() {
      assumedChanges.slice().reverse().forEach(change => {
        const selector = `.cell[data-x="${change.x}"][data-y="${change.y}"] span`;
        document.querySelectorAll(selector).forEach(span => {
          if (Number(span.textContent) === change.value) {
            // span.className = change.previousClass; 
            span.className = classNameTable[change.previousClass];
          }
        });
      });
      // assumedChanges = [];
      assumedChanges.length = 0;
      
    }


    //------------------------------------------------
    //  一時保存データ読み込時に、既に仮定モードONになっていて、この過程モードをOFFにしたことにより、数値を水色から黒に戻す処理
    //　一時保存データ読み込時に、既に仮定モードONで水色が存在する場合は、isAssumeCyan=trueとなっている。
    // 
    //　一時保存データ（JSONファイル）の内容が仮定モードOFF時の場合、盤面復元した時にどれが水色であったかを記録しておく。
    // なぜなら、仮定モードをOFFにしたときに、盤面復元後に何を仮定としたか（水色にしたか）は、assumedChangesに記録されているが、
    // 盤面復元時に既に水色となっていた数値の情報がないため、OFFを解除しても水色が残ってしまうのを防ぐため。
    // なのでuploadCyanを盤面復元時に登録している。
    function revertLoadCyanChange() {
      uploadCyan.forEach( change => {
        const selector = `.cell[data-x="${change.x}"][data-y="${change.y}"] span`;
        document.querySelectorAll(selector).forEach(span => {
          if (Number(span.textContent) === change.value) {
            // span.className = change.previousClass;
            span.classList.replace ("cyan", "black");
          }
        });
      });
      // uploadCyan = [];
      uploadCyan.length = 0;
      
    }

    //------------------------------------------------
    // ゲーム状態をJSONにしてダウンロード（JSONファイルを作成して保存）
    // function downloadGameState() {
    function downloadGameState() {
      const gameState = {};

      document.querySelectorAll('.cell').forEach(cell => {
        const x = cell.dataset.x;
        const y = cell.dataset.y;
        const spans = [...cell.querySelectorAll('span')];
        const digits = spans.map(span => ({
          value: span.textContent,
          className: span.className
        }));
        const confirmed = cell.classList.contains('confirmed');
        if (digits.length > 0) {
          gameState[`${x},${y}`] = { digits, confirmed };
        }
      });

      const json = JSON.stringify(gameState, null, 2);
      // const blob = new Blob([json], { type: 'application/json' });
      const blob = new Blob([json], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.target = "_blank";
      // const date = new Date().toISOString().replace(/[:.]/g, '-');
      const now = new Date().toISOString();

      // const date = new Date().toISOString().replace(/[:.]/g, '');
      const date = now
        .slice(2)
        .replace('T', '')     // 日付と時間を分離
        .replace(/[-:]/g, '')  // - と : を削除
        .split('.')[0];        // ミリ秒を削除        

      a.download = `KakuroTime_${selectedPuzzleNo}_${date}.json`;        
      document.body.appendChild(a);
      a.style.display = "none";
      a.click();

      setTimeout(() => {
        document.body.removeChild(a);
      }, 1000);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 60000);

    // 保存していたJSONファイルを読み込んで盤面を復元
    function uploadGameState(event) {
      const file = event.target.files[0];
      if (!file) return;

      const match = file.name.match(/KakuroTime_(\d+)_/);
      if (match) {
        selectedPuzzleNo = Number(match[1]);
      }

      createplayboard(selectedPuzzleNo);
      isAssumeMode = false;
      if (usePopup) currentMode = "input";
      const reader = new FileReader();
      reader.onload = function (e) {
        const gameState = JSON.parse(e.target.result);
        Object.entries(gameState).forEach(([key, data]) => {
          const [x, y] = key.split(',');
          const cell = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
          if (!cell) return;

          cell.innerHTML = ''; // 一旦消す
          data.digits.forEach(d => {
            const span = document.createElement('span');
            span.textContent = d.value;
            span.classList = d.className;
            if (span.classList.contains("red")) {
              isAssumeMode = true; 
              if (usePopup) {
                currentMode = "assume";
                selectedAssume = span;
                setMode(currentMode);
                updateModeButtons();
              }
            } else if (span.classList.contains("cyan")) {
              uploadCyan.push({
                x: Number(x),
                y: Number(y),
                // value: span.textContent !=="" ? Number(span.textContent) : 0,
                value: Number(span.textContent),
                loadClass: classNameTable.indexOf(d.className)
              })
              isAssumeCyan = true;
            }
            cell.appendChild(span);
          });

          if (data.confirmed) {
            cell.classList.add('confirmed');
            cell.querySelectorAll('span').forEach(span => {
              if (!span.classList.contains('gray')) {
                span.classList.add('confirmed-text');
              }
            });
          }
        });
      };
      reader.readAsText(file);
      event.target.value = "";

      document.getElementById("puzzleSelect").value = String(selectedPuzzleNo);

    }

    function createplayboard(puzzleNo) {
      // 🌟 1. メタデータから、選択された問題の幅・高さ・開始位置などを一瞬で取得
      const meta = stageMetadata[puzzleNo];
      if (!meta) return;

      boardWidth = meta.width;
      boardHeight = meta.height;
      const startOffset = meta.start;
      const specialCellCount = meta.length;

      // 確仮ボタン追加（既存のロジックを維持）
      window.inputMode = "candidate";   
      isAssumeMode = false;
      if (usePopup) {
        currentMode = "input";
        selectedAssume = null;
        setMode(currentMode);
        updateModeButtons();
      }
      
      const board = document.getElementById('grid');
      board.innerHTML = ''; // 既存の盤面をクリア

      // 🌟 2. プレイ中に高速で座標検索できるように、このステージの特殊マス（block, clue）だけを一時的にMapに登録
      // ※cells.findで毎回ループを回すより圧倒的に速く、メモリもこの関数内だけで自動解放されます
      const specialCellsMap = new Map();

      for (let i = 0; i < specialCellCount; i++) {
        // 32ビット整数を1つ取得
        const data = allStagesData[startOffset + i];

        // ビットをずらして情報を復元
        const x      = (data >> SHIFT_X) & 0x1F;      // 5ビット
        const y      = (data >> SHIFT_Y) & 0x1F;      // 5ビット
        const type   = (data >> SHIFT_TYPE) & 0x01;   // 1ビット（0: block, 1: clue）
        const across = (data >> SHIFT_ACROSS) & 0xFF; // 8ビット
        const down   = (data >> SHIFT_DOWN) & 0xFF;   // 8ビット

        // 座標文字列（"x,y"）をキーにして、ビット展開した情報を記憶
        specialCellsMap.set(`${x},${y}`, { type, across, down });
      }

      // 🌟 3. 盤面の描画ループ
      for (let y = 0; y < boardHeight; y++) {
        for (let x = 0; x < boardWidth; x++) {

          const div = document.createElement("div");
          div.className = "cell";
          div.dataset.x = x;
          div.dataset.y = y;

          // ⚠️ 【メモリ最適化】
          // すでに document.addEventListener でクリックを監視（イベント委譲）されているため、
          // ここでの「div.onclick = ...」の81回〜200何回もの関数生成・登録は完全に削除します。
          // これにより、盤面生成時のメモリ消費がさらに数分の一に減ります。

          board.appendChild(div); // ※grid.appendChildからboard.appendChildに安全のため統一しています

          // 🌟 4. Mapから一瞬で該当座標の特殊マス情報を取得（無駄なループが発生しません）
          const specialCell = specialCellsMap.get(`${x},${y}`);

          if (!specialCell) {
            // 通常の空白マス（白）
            div.className = 'cell';
          } else {
            // 🌟 特殊マスの処理
            if (specialCell.type === TYPE_BLOCK) {
              // 【修正ポイント】黒マス（block）のときも、ご自身のCSSで黒塗りになるクラス名を設定します！
              // これで、ヒントマスと全く同じ綺麗な黒塗りが適用されます。
              div.className = 'cell clue'; 
              
            } else if (specialCell.type === TYPE_CLUE) {
              // ヒントマスの処理（現状正しく動いている既存ロジック）
              div.className = 'cell clue';
              let isSlash = false;
              
              if (specialCell.across > 0) {
                const clueRight = document.createElement('div');
                clueRight.className = 'clue-right';
                clueRight.textContent = specialCell.across;
                div.appendChild(clueRight);
                isSlash = true;
              }

              if (specialCell.down > 0) {
                const clueDown = document.createElement('div');
                clueDown.className = 'clue-down';
                clueDown.textContent = specialCell.down;
                div.appendChild(clueDown);
                isSlash = true;
              }

              if (isSlash) {
                const slash = document.createElement('div');
                slash.className = 'slash';
                div.appendChild(slash);
              }
            }
          }
        }
      }
    }

    //------------------------------------------------
    //  ヒントポップアップ作成処理（ページロード時に一度だけ実行）
    function initHintUI() {
      const lengthSelect = document.getElementById("hintLength");
      const sumSelect = document.getElementById("hintSum");

      // マス数（8～5）
      for (let i = 8; i >= 4; i--) {
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = i;
        lengthSelect.appendChild(opt);
      }

      // 合計（仮：44～15）
      for (let i = 44; i >= 10; i--) {
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = i;
        sumSelect.appendChild(opt);
      }

      const hint = document.querySelector(".hint-content");

      let startY = 0;
      let startTop = 0;
      let isDragging = false;
      let currentTransformY = 0; 

      hint.addEventListener("touchstart", (e) => {
        isDragging = true;

        // 🌟 タッチ開始時は、まだ移動直後フラグを false にしておく
        isHintJustDragged = false; 

        startY = e.touches[0].clientY;

        const select = document.getElementById('puzzleSelect');
        if (select) {
          select.value = String(selectedPuzzleNo);
        }
        // GPUモード対応
        // 位置計算方法の改善
        // 【劇的改善】getBoundingClientRect()の代わりに、現在のtransformの値を安全に取得する
        // これにより、ブラウザへの強制的な位置再計算（リフロー）を完全にストップします
        // 改善前 
        // startTop = hint.getBoundingClientRect().top;
        // 改善後
        const style = window.getComputedStyle(hint);
        const matrix = new WebKitCSSMatrix(style.transform);
        currentTransformY = matrix.m42; // 現在のY方向の移動量を取得
      });

      hint.addEventListener("touchmove", (e) => {
        if (!isDragging) return;

        // 🌟 指が動いてドラッグが発生した瞬間に、移動したという目印（フラグ）を立てる
        isHintJustDragged = true;

        const currentY = e.touches[0].clientY;
        const deltaY = currentY - startY;

        // GPUモード対応：　次の移動量を計算
        // let newTop = startTop + deltaY;
        let newTransformY = currentTransformY + deltaY;

        const baseTop = hint.offsetTop; // 初期配置のTop位置
        const maxMoveY = window.innerHeight - hint.offsetHeight - baseTop - 10;
        const minMoveY = 10 - baseTop;

        if (newTransformY < minMoveY) newTransformY = minMoveY;
        if (newTransformY > maxMoveY) newTransformY = maxMoveY;

        // 【劇的改善】style.topの代わりに、GPU（transform）を使って移動！
        // 1秒間に60回動かしても、メインメモリを1バイトも汚さず、超軽量に滑らかに動く
        hint.style.transform = `translateY(${newTransformY}px)`;
        
        // 画面の不要なスクロール（バウンスなど）を防止する
        e.preventDefault(); 
      // });
      }, { passive: false }); // preventDefaultを効かせるための設定

      hint.addEventListener("touchend", () => {
        isDragging = false;
        // 🌟 指が離れたあと、遅れてやってくる「click」イベントを確実に捕まえてガードするため、
        // 150ミリ秒後に自動でフラグを下ろすタイマーを仕込みます
        setTimeout(() => {
          isHintJustDragged = false;
        }, 150);


      });
    }

    //------------------------------------------------
    //  ファイル読み込みボタン押下時の処理
    function handleFileSelect(fileText) {
      let globalOffset = 0;
      stageIdList = []; // 初期化

      // テキストを1行ずつに分割する
      const lines = fileText.split(/\r?\n/);

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        // 空行や、ファイルの最初と最後のカッコ「{」「}」だけの行はスキップ
        if (!line || line === "{" || line === "}") continue;

        // 行末のカンマ「,」を削除して、有効なJSONオブジェクトの形にする
        if (line.endsWith(",")) {
          line = line.slice(0, -1);
        }

        // 1行分のJSON（例： "1": {"width": 13, "height": 10, ...} ）をパースするために
        // 前後に仮のカッコをつけて完全なJSON形式にする
        let parsedLine = null;
        try {
          parsedLine = JSON.parse("{" + line + "}");
        } catch (e) {
          console.error("行のパースに失敗しました（スキップします）:", line);
          continue;
        }

        // パースしたオブジェクトから、問題番号（キー）を取得
        const stageKeys = Object.keys(parsedLine);
        if (stageKeys.length === 0) continue;
        
        const stageKey = stageKeys[0]; // 例: "1"
        let stage = parsedLine[stageKey]; // その問題のデータ
        let specialCellCount = stage.cells.length;

        // 🌟 1. ドロップダウン用の問題番号を記録
        stageIdList.push(stageKey);

        // 🌟 2. メタデータを記録
        stageMetadata[stageKey] = {
          width: stage.width,
          height: stage.height,
          start: globalOffset,
          length: specialCellCount
        };

        // 🌟 3. 特殊マスを1つずつ32bit整数に圧縮して型付き配列に格納
        for (let c = 0; c < specialCellCount; c++) {
          let cell = stage.cells[c];
          let compressedInt = 0;

          compressedInt |= (cell.x << SHIFT_X);
          compressedInt |= (cell.y << SHIFT_Y);

          let type = (cell.type === "clue") ? TYPE_CLUE : TYPE_BLOCK;
          compressedInt |= (type << SHIFT_TYPE);

          if (cell.across !== undefined) compressedInt |= (cell.across << SHIFT_ACROSS);
          if (cell.down !== undefined)    compressedInt |= (cell.down << SHIFT_DOWN);

          // 巨大な型付き配列に直接書き込む
          allStagesData[globalOffset + c] = compressedInt;
        }

        // 次の問題のためにオフセットを進める
        globalOffset += specialCellCount;

        // 【最重要】この行のパースオブジェクトを即座に完全破棄
        // ループのたびにメモリが完全にクリーンアップされます
        parsedLine = null;
        stage = null;
      }

      // 🌟 4. 全問題の読み込み完了後、UIを更新
      updateDropdownUI(); // ドロップダウンリストを生成
      // displayStage(stageIdList[0]); // 1問目の盤面を表示
    }
